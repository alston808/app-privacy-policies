<footer>
  <p>
    &copy; {{ site.time | date: "%Y" }} Alston Albarado.
    All rights reserved.
  </p>

  <div class="footerIcons">
    {% if site.email_address %}
      <a href="mailto:{{ site.email_address }}" title="Email">
        <i class="fas fa-envelope"></i>
      </a>
    {% endif %}

    {% if site.github_username %}
      <a href="https://github.com/{{ site.github_username }}" title="GitHub">
        <i class="fab fa-github"></i>
      </a>
    {% endif %}

    {% if site.linkedin_username %}
      <a href="https://linkedin.com/in/{{ site.linkedin_username }}" title="LinkedIn">
        <i class="fab fa-linkedin"></i>
      </a>
    {% endif %}

    {% if site.twitter_username %}
      <a href="https://twitter.com/{{ site.twitter_username }}" title="Twitter">
        <i class="fab fa-twitter"></i>
      </a>
    {% endif %}
  </div>

  <p>
    <small>
      <a href="{{ site.baseurl }}/">App Legal Documents</a> |
      <a href="mailto:alston.albarado@gmail.com">alston.albarado@gmail.com</a>
    </small>
  </p>
</footer>
