{% if page.features %}
<div class="features container">
  {% for feature in page.features %}
    <div class="feature">
      {% if feature.fontawesome_icon_name %}
        <i class="fas fa-{{ feature.fontawesome_icon_name }}"></i>
      {% endif %}
      <div class="featureText">
        <h3>{{ feature.title }}</h3>
        <p>{{ feature.description }}</p>
      </div>
    </div>
  {% endfor %}
</div>
{% endif %}
