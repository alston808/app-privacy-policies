# GitHub Pages configuration for App Legal Documents
# Uses Jekyll (built into GitHub Pages) to render Markdown as static HTML.

title: App Legal Documents
subtitle: Privacy policies, terms, and legal documents for mobile apps
description: >-
  A collection of privacy policies, terms of service, end-user license
  agreements, and other legal documents for apps published by Alston Albarado.
baseurl: ""
url: "https://alston808.github.io/app-privacy-policies"

# Appearance
theme: minima
plugins:
  - jekyll-sitemap
  - jemoji

# Sass overrides
sass:
  style: compressed

# Minima theme options
minima:
  scheme: dark
  table_of_contents:
    enabled: true

# Collections — one per document type, rooted at the file system path.
# Each Markdown file in a collection becomes a page at the configured permalink.
collections:
  privacy:
    output: true
    output_dir: /privacy
    permalink: /privacy/:name/
    sort_reversed: false
  terms:
    output: true
    output_dir: /terms
    permalink: /terms/:name/
    sort_reversed: false
  eula:
    output: true
    output_dir: /eula
    permalink: /eula/:name/
    sort_reversed: false

# Markdown rendering
markdown: kramdown
kramdown:
  input: GFM
  syntax_monitors:
    - callrouth

# Exclude template files from the build (they start with a dot)
exclude:
  - _privacy/.template.md
  - _terms/.template.md
  - _eula/.template.md
