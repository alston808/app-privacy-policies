# GitHub Pages configuration for App Legal Documents
# Uses Jekyll (built into GitHub Pages) to render Markdown as static HTML.
#
# URL structure:
#   https://alston808.github.io/                    → root index (lists all apps)
#   https://alston808.github.io/beatvibrator/       → app index page
#   https://alston808.github.io/beatvibrator/privacy → privacy policy
#   https://alston808.github.io/beatvibrator/terms   → terms of service
#   https://alston808.github.io/beatvibrator/eula    → end-user license agreement

title: App Legal Documents
subtitle: Privacy policies, terms, and legal documents for mobile apps
description: >-
  A collection of privacy policies, terms of service, end-user license
  agreements, and other legal documents for apps published by Alston Albarado.
baseurl: ""
url: "https://alston808.github.io"

# Appearance
theme: minima
plugins:
  - jekyll-sitemap
  - jemoji

# Sass — using compressed output for production
sass:
  style: compressed

# Minima theme options
minima:
  scheme: dark
  table_of_contents:
    enabled: true

# Markdown rendering
markdown: kramdown
kramdown:
  input: GFM
  syntax_monitors:
    - callrouth

# Exclude template files from the build
exclude:
  - apps/.templates
