# ─────────────────────────────────────────────────────────────────────────────
# GitHub Pages configuration — App Legal Documents
# Multi-app landing pages with privacy policies, terms, and EULAs.
# Based on the automatic-app-landing-page template (adapted for Android/multi-app).
# ─────────────────────────────────────────────────────────────────────────────

# Site info
title: App Legal Documents
subtitle: Privacy policies, terms, and legal documents for mobile apps
description: Legal documents for apps published by Alston Albarado.

# No baseurl needed for user pages (https://alston808.github.io)
baseurl: ""
url: "https://alston808.github.io"

# Appearance — no theme; we use custom layouts and SCSS.
# (Minima's main.scss was overriding our custom stylesheet.)
plugins:
  - jekyll-sitemap

# Sass
sass:
  style: compressed

# Markdown rendering
markdown: kramdown
kramdown:
  input: GFM

# Exclude
exclude:
  - .sass-cache
  - .jekyll-cache
  - apps/.templates
